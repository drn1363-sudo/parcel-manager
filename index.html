<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مرسولات">
  <meta name="description" content="مدیریت بار و مرسولات پستی فروشگاه">
  
  <title>مدیریت مرسولات</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="loading-icon">📦</div>
      <div class="loading-text">در حال بارگذاری...</div>
    </div>
  </div>
  
  <div id="app" class="app-container" style="display:none;">
    
    <header class="app-header">
      <div class="header-content">
        <button id="btn-back" class="btn-icon header-btn" style="display:none;" aria-label="بازگشت">←</button>
        <h1 id="page-title" class="page-title">مدیریت مرسولات</h1>
        <button id="btn-menu" class="btn-icon header-btn" aria-label="منو">☰</button>
      </div>
    </header>
    
    <main id="view-root" class="view-root"></main>
    
    <nav id="bottom-nav" class="bottom-nav">
      <a href="#/dashboard" class="nav-item active" data-route="dashboard">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">خانه</span>
      </a>
      <a href="#/shipments" class="nav-item" data-route="shipments">
        <span class="nav-icon">📦</span>
        <span class="nav-label">مرسولات</span>
      </a>
      <a href="#/scan" class="nav-item nav-item-scan" data-route="scan">
        <span class="nav-icon">📷</span>
        <span class="nav-label">اسکن</span>
      </a>
      <a href="#/suppliers" class="nav-item" data-route="suppliers">
        <span class="nav-icon">🏪</span>
        <span class="nav-label">فروشگاه‌ها</span>
      </a>
      <a href="#/settings" class="nav-item" data-route="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">تنظیمات</span>
      </a>
    </nav>
    
  </div>
  
  <div id="modal-root" class="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/scan.js"></script>
  <script src="js/views/shipment-form.js"></script>
  <script src="js/views/shipments-list.js"></script>
  <script src="js/views/shipment-detail.js"></script>
  <script src="js/views/suppliers.js"></script>
  <script src="js/views/supplier-detail.js"></script>
  <script src="js/views/supplier-form.js"></script>
  <script src="js/app.js"></script>
  
</body>
</html>
